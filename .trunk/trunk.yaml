---
version: 0.1
cli:
    version: 1.25.0
plugins:
    sources:
        - id: trunk
          ref: v1.7.4
          uri: https://github.com/trunk-io/plugins
lint:
    enabled:
        - checkov@3.2.493
        - terrascan@1.19.9
        - trivy@0.67.2
        - trufflehog@3.91.0
        - yamllint@1.37.1
        - actionlint@1.7.8
        - git-diff-check
        - hadolint@2.14.0
        - markdownlint@0.45.0
        - gitleaks@8.29.0
        - prettier@3.6.2
runtimes:
    enabled:
        - python@3.10.8
        - go@1.21.0
        - node@22.16.0
actions:
    enabled:
        - trunk-announce
        - trunk-check-pre-push
        - trunk-fmt-pre-commit
        - trunk-upgrade-available
